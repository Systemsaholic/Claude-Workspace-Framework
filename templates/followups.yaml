# [WORKSPACE] - Scheduled Followups
# One-time tasks that trigger at a specific time
#
# Add entries to schedule tasks. The memory-cron will process due items.
#
# Fields:
#   id: unique-identifier (required)
#   created_by_session: session that created this (required)
#   created_at: ISO timestamp when created (required)
#   due: ISO timestamp with timezone when to trigger (required)
#   type: task type - send_email, check_status, review, reminder, custom (required)
#   description: detailed instructions for what to do (required)
#   context: additional data needed (optional)
#   target_session: route to existing session (optional)
#   status: pending, completed, cancelled (required)

followups: []

