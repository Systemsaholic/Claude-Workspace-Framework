name: Validate Framework Purity

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    name: Check for project-specific content

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run framework validator
        run: |
          chmod +x ./scripts/validate-framework.sh
          ./scripts/validate-framework.sh .

      - name: Check placeholder patterns
        run: |
          echo "Verifying placeholder patterns are used..."

          # Ensure generic placeholders exist (sanity check)
          REQUIRED_PLACEHOLDERS=(
            "example.com"
            "YOUR_ORG"
            "Acme"
          )

          for pattern in "${REQUIRED_PLACEHOLDERS[@]}"; do
            if ! grep -rq "$pattern" --include="*.md" --include="*.sh" . 2>/dev/null; then
              echo "::warning::Expected placeholder '$pattern' not found - verify examples use generic names"
            fi
          done

          echo "✓ Placeholder patterns check complete"

      - name: Validate YAML syntax
        run: |
          echo "Validating YAML files..."
          for file in $(find . -name "*.yaml" -o -name "*.yml" | grep -v node_modules); do
            python3 -c "import yaml; yaml.safe_load(open('$file'))" 2>/dev/null || {
              echo "::error::Invalid YAML: $file"
              exit 1
            }
          done
          echo "✓ All YAML files valid"

      - name: Check for secrets in files
        run: |
          echo "Scanning for potential secrets..."

          # Patterns that indicate real secrets (not placeholder patterns)
          SECRET_PATTERNS=(
            "sk_live_[A-Za-z0-9]{20,}"
            "ghp_[A-Za-z0-9]{36}"
            "gho_[A-Za-z0-9]{36}"
            "AKIA[0-9A-Z]{16}"
          )

          for pattern in "${SECRET_PATTERNS[@]}"; do
            MATCHES=$(grep -rE "$pattern" --include="*.md" --include="*.yaml" --include="*.yml" --include="*.py" --include="*.sh" --include="*.json" . 2>/dev/null | grep -v ".github/workflows" || true)

            if [ -n "$MATCHES" ]; then
              echo "::error::Potential secret found matching pattern: $pattern"
              echo "$MATCHES"
              exit 1
            fi
          done

          echo "✓ No secrets detected"

      - name: Check for sensitive files
        run: |
          echo "Checking for sensitive files..."

          SENSITIVE=$(find . -type f \( \
            -name ".env" -o \
            -name ".env.local" -o \
            -name ".env.production" -o \
            -name "*.pem" -o \
            -name "*.key" -o \
            -name "id_rsa" -o \
            -name "id_ed25519" -o \
            -name "credentials.json" -o \
            -name "secrets.yaml" \
            \) ! -name ".env.example" 2>/dev/null || true)

          if [ -n "$SENSITIVE" ]; then
            echo "::error::Sensitive files found:"
            echo "$SENSITIVE"
            exit 1
          fi

          echo "✓ No sensitive files detected"
